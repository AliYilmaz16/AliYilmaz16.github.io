projeler:
  - kimlik: balon-takip
    yil: 2025
    ad: { tr: Balon Takip, en: Balloon Tracker }
    alan: goruntu-isleme
    baglam:
      tr: Teknofest Hava Savunma Sistemleri Yarışması
      en: Teknofest Air Defence Systems Competition
    ozet:
      tr: YOLOv8n ile balon tespiti ve kaçan karelerde kilidi koruyan, projeye özel bir takip sınıfı.
      en: Balloon detection with YOLOv8n and a purpose-built tracker that holds its lock through missed frames.
    sorun:
      tr: Yarışma kuralları ve donanım sınırları yüksek kare hızı istiyordu. En hafif model olan YOLOv8n hızlıydı ama uzak mesafede ve ani hareketlerde hedefi kaçırıyor, ham tespitler titriyordu; bu da atış mekanizmasını bozuyordu.
      en: Competition rules and hardware limits demanded a high frame rate. YOLOv8n, the lightest model, was fast but lost the target at long range and during sudden movement, and the raw detections jittered, which upset the firing mechanism.
    # Özgeçmişteki satırdan alındı; istersen ayrıntılandır.
    rol:
      tr: Sefir-i Gök takımının yazılım takım lideri olarak YOLO mimarisiyle gerçek zamanlı hedef tespiti ve takip sisteminin geliştirilmesinde yer aldım.
      en: As software team lead of the Sefir-i Gök team I took part in developing the real-time target detection and tracking system built on the YOLO architecture.
    araclar: [Python, YOLOv8n, OpenCV, NumPy]
    karar:
      tr: DeepSORT gibi hazır bir takipçi yerine sisteme özel bir takip sınıfı yazıldı. Sınıf, hedefin son 8 konumundan hız vektörünü hesaplıyor, kamera hedefi kaçırdığında bir sonraki konumu tahmin ediyor ve koordinatları üstel hareketli ortalamayla yumuşatıyor.
      en: Instead of an off-the-shelf tracker such as DeepSORT, a tracking class was written for this system. It computes a velocity vector from the target's last 8 positions, predicts the next position when the camera misses the target, and smooths the coordinates with an exponential moving average.
    sonuc:
      tr: Tespit bir karede kaçsa da kilit korunuyor ve titreme süzülüyor. Sahnedeki hedefler ana hedef ve ikincil olarak ayrılıyor, en kararlı olan kendiliğinden seçiliyor. Model, yarışma sahasına uygun balonlarla çekilip makesense.ai üzerinde elle etiketlenen fotoğraflarla eğitildi.
      en: The lock is held even when a detection drops for a frame, and the jitter is filtered out. Targets in the scene are split into a main target and secondaries, and the most stable one is selected automatically. The model was trained on photos of competition-style balloons, shot for the project and labelled by hand on makesense.ai.
    gorseller:
      - dosya: video-kare.jpg
        alt: { tr: "Takip çıktısı: ana hedef ve iki ikincil hedef", en: "Tracker output: main target and two secondary targets" }
      - dosya: tespit.jpg
        alt: { tr: Üç balonun tespiti ve ana hedef seçimi, en: Detection of three balloons and main target selection }
    video: /video/balon-takip.mp4
    depo: https://github.com/AliYilmaz16/Balon-Takip

  - kimlik: isg-guard
    yil: 2026
    ad: { tr: İSG Guard, en: ISG Guard }
    alan: web
    baglam:
      tr: Node.js ile Web Programlama dersi projesi
      en: Course project, Web Programming with Node.js
    ozet:
      tr: Saha çalışanının telefonunu algılayıcı olarak kullanan iş güvenliği sistemi; düşme, tehlikeli bölge ve gürültü alarmları yönetici paneline canlı düşer.
      en: A workplace safety system that uses the worker's phone as the sensor; fall, danger-zone and noise alarms reach the admin panel live.
    sorun:
      tr: Sahada çalışan birinin düşmesi, sert bir darbe alması ya da tehlikeli bir bölgeye girmesi çoğu zaman geç fark edilir. Amaç, ek donanım gerektirmeden bu durumları anında yöneticiye bildirmekti.
      en: When a field worker falls, takes a hard impact or walks into a hazardous area, it is often noticed late. The goal was to report these events to a supervisor immediately, without extra hardware.
    # EKSIK: Bu projedeki rolün (tek başına mı, takımla mı, hangi kısım senin).
    rol: { tr: "", en: "" }
    araclar: [Node.js, Express, Socket.io, PostgreSQL, Prisma, React, Leaflet, Flutter, Telegram Bot API]
    karar:
      tr: Özel bir cihaz yerine telefonun ivmeölçeri, GPS'i ve mikrofonu kullanıldı. İvme verisi eşik değeri ve z-skoru ile çözümleniyor; konum, tanımlı tehlikeli bölgelerle karşılaştırılıyor.
      en: Rather than a dedicated device, the phone's accelerometer, GPS and microphone are used. Acceleration data is analysed with thresholds and z-scores, and location is checked against defined danger zones.
    sonuc:
      tr: Sert darbe, düşme şüphesi, tehlikeli bölgeye giriş, hareketsizlik ve yüksek gürültü alarm üretiyor. Yönetici çalışanları haritada canlı izliyor; yüksek riskli alarmlar Telegram'dan da gidiyor.
      en: Hard impacts, suspected falls, danger-zone entry, inactivity and high noise raise alarms. The supervisor follows workers live on a map, and high-risk alarms are also sent over Telegram.
    gorseller:
      - dosya: web-1.png
        alt: { tr: Yönetici paneli, canlı harita, en: Admin panel with live map }
      - dosya: web-2.png
        alt: { tr: Haritada çalışanlar ve tehlikeli bölgeler, en: Workers and danger zones on the map }
      - dosya: web-4.png
        alt: { tr: Cihaz ayrıntıları ve uyarılar, en: Device details and alerts }
      - dosya: web-3.png
        alt: { tr: Yönetici arayüzü, en: Admin interface }
      - dosya: mobile-1.png
        alt: { tr: Mobil veri toplama uygulaması, en: Mobile data collection app }
      - dosya: mobile-2.png
        alt: { tr: Mobil uygulama, izleme ekranı, en: Mobile app, monitoring screen }
    depo: https://github.com/AliYilmaz16/isg-guard

  - kimlik: stackout
    yil: "2025 - 2026"
    ad: Stackout
    alan: mobil
    baglam:
      tr: Expo ve React Native ile mobil oyun
      en: Mobile game built with Expo and React Native
    ozet:
      tr: Blok yığma ve blok kırma oyunlarını tek tahtada birleştiren mobil oyun; dolan satırlar silinmez, kırılacak beyaz bloklara döner.
      en: A mobile game that joins block stacking and brick breaking on one board; completed rows are not cleared, they turn into white blocks to break.
    sorun:
      tr: İki mod aynı tahtayı ve aynı skoru paylaşıyor. İkisini yan yana koymak yetmezdi; birinde yapılan hamlenin ötekinde karşılığı olması gerekiyordu.
      en: The two modes share one board and one score. Putting them side by side was not enough; a move in one had to matter in the other.
    # EKSIK: Bu projedeki rolün.
    rol: { tr: "", en: "" }
    araclar: [TypeScript, React Native, Expo, Jest]
    karar:
      tr: Oyun durumu React state'inde değil, tek bir değişebilir nesnede tutuluyor ve her karede güncelleniyor. Oyun mantığı arayüzden ayrı, durumu alan serbest fonksiyonlar olarak yazıldığı için React olmadan birim testleriyle deneniyor.
      en: Game state lives in a single mutable object updated every frame rather than in React state. The game logic is written as free functions that take the state, separate from the interface, so it is unit-tested without React.
    sonuc:
      tr: Yığma modunda üç parçadan biri seçiliyor; dolan satırlar beyaz bloğa dönüşüp top kazandırıyor. Kırma modunda bu toplarla beyaz bloklar kırılıyor, art arda kırılan bloklar artan puan veriyor. Dokunmatik hareketler, ses ve skor arttıkça hızlanan zorluk var; oyun çevrimdışı çalışıyor ve veri toplamıyor.
      en: In stacking mode you pick one of three pieces; completed rows turn into white blocks and earn balls. In breaking mode those balls break the white blocks, with rising points for consecutive hits. It has touch gestures, sound and difficulty that speeds up with the score; the game runs offline and collects no data.
    gorseller:
      - dosya: simge.png
        alt: { tr: Stackout uygulama simgesi, en: Stackout app icon }
    etkilesim: stackout

  - kimlik: berber-randevu
    yil: 2026
    ad: { tr: Berber Randevu Sistemi, en: Barber Booking System }
    alan: web
    baglam:
      tr: Tek kişilik bir berber dükkânı için
      en: For a one-person barber shop
    ozet:
      tr: Müşterinin telefondan randevu aldığı, berberin gününü, müşteri defterini ve kazancını yönettiği web uygulaması.
      en: A web application where customers book from their phone and the barber manages the day, the customer ledger and earnings.
    sorun:
      tr: Tek kişilik bir dükkân için müşterinin telefondan randevu alıp izleyebildiği, berberin de gününü tek ekrandan yönettiği bir sistem gerekiyordu.
      en: A one-person shop needed a system where customers can book and follow an appointment from their phone and the barber runs the day from a single screen.
    # EKSIK: Bu projedeki rolün.
    rol: { tr: "", en: "" }
    araclar: [TypeScript, Next.js, Prisma, PostgreSQL]
    karar:
      tr: Randevular tarih ve gece yarısından itibaren dakika olarak saklanıyor; müsaitlik hesabı tam sayı aritmetiği, çakışma denetimi tek satır. Müsaitlik motoru veritabanına ve saate dokunmayan saf bir fonksiyon olduğu için veritabanı olmadan test ediliyor.
      en: Appointments are stored as a date plus minutes since midnight, so availability is integer arithmetic and the overlap check is one line. The availability engine is a pure function that touches neither the database nor the clock, so it is tested without a database.
    sonuc:
      tr: Müşteri hizmet, gün ve saat seçip randevu alıyor, durumunu izliyor, iptal edebiliyor ve randevuyu telefon takvimine ekleyebiliyor. Onay bekleyen randevu da takvimde yer kapladığı için aynı saat iki kişiye verilmiyor. Berber panelinde günlük ve haftalık görünüm, müşteri defteri, hizmet süreleri ve ücretleri, kazanç özeti var.
      en: Customers pick a service, day and time, follow the status, cancel, and add the appointment to their phone calendar. An appointment awaiting approval still occupies the calendar, so the same time is never given to two people. The barber's panel has day and week views, a customer ledger, service durations and prices, and an earnings summary.
    etkilesim: randevu

