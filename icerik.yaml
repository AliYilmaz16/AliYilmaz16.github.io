      tr: Pardus Linux için
      en: For Pardus Linux
    ozet:
      tr: Pardus için grafik ve terminal arayüzlü müzik çalar; tamamı tek bir Bash betiği.
      en: A music player for Pardus with both a graphical and a terminal interface, all in a single Bash script.
    sorun:
      tr: Aynı çalarının hem masaüstünde hem de yalnızca terminal bulunan ortamda kullanılabilmesi isteniyordu.
      en: The same player needed to work both on the desktop and where only a terminal is available.
    rol: { tr: "", en: "" }
    araclar: [Bash, YAD, Whiptail, mpg123]
    karar:
      tr: Bütün özellikler tek betikte toplandı; grafik arayüz YAD ile, terminal arayüzü Whiptail ile çiziliyor, sesi mpg123 çalıyor. Duraklatma ve sürdürme süreç sinyalleriyle yapılıyor.
