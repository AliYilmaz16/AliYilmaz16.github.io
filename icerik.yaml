    ad: MUCars Random Forest
    alan: makine-ogrenmesi
    aciklama:
      tr: Fas ikinci el araç verisinde (MUCars-2024) Random Forest ile dört fiyat sınıfı tahmini. Veri Madenciliğine Giriş dersi projesi; test doğruluğu 0,8519.
      en: Predicting four price classes on Moroccan used-car data (MUCars-2024) with Random Forest. Course project for Introduction to Data Mining; test accuracy 0.8519.
  - depo_adi: SmartHome-Energy-Classifier
    ad: SmartHome Energy Classifier
    alan: makine-ogrenmesi
    aciklama:
      tr: Yalnızca hava durumu ve zaman bilgisiyle bir evin enerji tüketimini yüksek ya da düşük diye sınıflandırma. Üç model karşılaştırıldı; en iyisi KNN, %81,38.
      en: Classifying a home's energy use as high or low from weather and time data alone. Three models compared; KNN was best at 81.38%.
  - depo_adi: Hava-Kalitesi-Tahmin-Modeli
    ad: { tr: Hava Kalitesi Tahmin Modeli, en: Air Quality Prediction Model }
    alan: makine-ogrenmesi
    aciklama:
      tr: CO, ozon, NO₂ ve PM2.5 değerlerinden hava kalitesi sınıfı tahmini. Makine Öğrenmesine Giriş dersi projesi.
      en: Predicting the air-quality class from CO, ozone, NO₂ and PM2.5 values. Course project for Introduction to Machine Learning.
  - depo_adi: Akbank-Makine-Ogrenmesi-Bootcamp
    ad: { tr: Trafik Kazası Şiddeti Tahmini, en: Traffic Accident Severity Prediction }
    alan: makine-ogrenmesi
    aciklama:
      tr: Birleşik Krallık trafik kazası verisinde (1,5 milyon satır) kaza şiddeti tahmini. Akbank ve Global AI Hub Makine Öğrenmesi Bootcamp projesi; sınıf dengesizliği sorunu ve sınırları belgelendi.
      en: Predicting accident severity on UK road accident data (1.5 million rows). Project for the Akbank and Global AI Hub Machine Learning Bootcamp; the class-imbalance problem and its limits are documented.
  - depo_adi: Python202-Bootcamp
    ad: Python 202 Bootcamp
    alan: web
    aciklama:
      tr: Terminalde çalışan bir kitaplık uygulamasından FastAPI servisine üç aşamada büyüyen proje. Global AI Hub Python 202 Bootcamp.
      en: A project that grows in three stages from a terminal library app into a FastAPI service. Global AI Hub Python 202 Bootcamp.

