  - kimlik: sec-ded
    ad: { tr: Hamming SEC-DED Simülatörü, en: Hamming SEC-DED Simulator }
    alan: masaustu
    baglam:
      tr: Bilgisayar Mimarisi dersi dönem projesi
      en: Term project, Computer Architecture
    ozet:
      tr: Hamming kodunda tek hata düzeltmeyi ve çift hata tespitini bit bit gösteren PyQt5 simülatörü.
      en: A PyQt5 simulator that shows single-error correction and double-error detection in Hamming codes, bit by bit.
    sorun:
      tr: Hamming kodunun hatayı nasıl bulup düzelttiği kâğıt üzerinde izlenmesi zor bir konu. Amaç, kodlamayı, hata eklemeyi ve düzeltmeyi görünür kılmaktı.
      en: How a Hamming code locates and corrects an error is hard to follow on paper. The aim was to make encoding, error injection and correction visible.
    rol: { tr: "", en: "" }
    araclar: [Python, PyQt5]
    karar: { tr: "", en: "" }
    sonuc:
      tr: 8, 16 ve 32 bitlik veri kodlanıyor; veri, eşlik ve hatalı bitler ayrı renklerle gösteriliyor. Seçilen bite hata eklenebiliyor, sendrom hesaplanıyor, tek hata düzeltiliyor, çift hata bildiriliyor. Kodlar belleğe yazılıp geri okunabiliyor.
      en: 8-, 16- and 32-bit data can be encoded; data, parity and faulty bits are shown in different colours. An error can be injected at a chosen bit, the syndrome is computed, single errors are corrected and double errors are reported. Codes can be written to memory and read back.
    gorseller:
      - dosya: ana_ekran.png
        alt: { tr: Simülatör ana ekranı, en: Simulator main screen }
      - dosya: tek_hata.png
        alt: { tr: Tek bit hatası, en: Single-bit error }
      - dosya: cift_hata.png
        alt: { tr: Çift bit hatası, en: Double-bit error }
      - dosya: bellege_kaydet.png
        alt: { tr: Belleğe kaydetme, en: Saving to memory }
    video_baglanti: https://www.youtube.com/watch?v=j0MOhqZ0uog
    depo: https://github.com/AliYilmaz16/SEC-DED-Kodlay-c-

  - kimlik: c-syntax-highlighter
    ad: { tr: C Sözdizimi Vurgulayıcı, en: C Syntax Highlighter }
    alan: masaustu
    baglam:
      tr: Python ve tkinter
      en: Python and tkinter
    ozet:
      tr: C kodunu yazarken renklendiren, belirteç listesini ve ayrıştırma ağacını gösteren araç.
      en: A tool that highlights C code as you type and shows its token list and parse tree.
    sorun:
      tr: Bir derleyicinin kodu nasıl belirteçlere ayırdığını ve yapısını nasıl çıkardığını görmek için, bunu her tuş vuruşunda yapan bir düzenleyici yazıldı.
      en: To see how a compiler splits code into tokens and derives its structure, an editor was written that does this on every keystroke.
    rol: { tr: "", en: "" }
    araclar: [Python, tkinter]
    karar:
      tr: Belirteç listesi yukarıdan aşağıya (top-down) ayrıştırılıyor ve kodun yapısı hiyerarşik bir ağaç olarak ayrı pencerede gösteriliyor.
      en: The token list is parsed top-down and the structure of the code is shown as a hierarchical tree in a separate window.
    sonuc:
      tr: Anahtar sözcükler, tanımlayıcılar, sayılar, işleçler, metinler, yorumlar ve ön işlemci komutları yazıldığı anda renkleniyor. Proje bir tanıtım videosu ve bir yazıyla belgelendi.
      en: Keywords, identifiers, numbers, operators, strings, comments and preprocessor directives are coloured as they are typed. The project is documented with a demo video and an article.
    gorseller:
      - dosya: giris.png
        alt: { tr: Düzenleyici ana ekranı, en: Editor main screen }
      - dosya: tokens.png
        alt: { tr: Belirteç listesi, en: Token list }
      - dosya: parsetree.png
        alt: { tr: Ayrıştırma ağacı, en: Parse tree }
    video_baglanti: https://www.youtube.com/watch?v=BTF3QeLcvoc
    depo: https://github.com/AliYilmaz16/C-Syntax-Highlighter-with-Python

