# ─── ÖNE ÇIKAN PROJELER ──────────────────────────────────────────────────────
# Sıra, sitedeki sıradır. "kimlik" adres olur: /proje/<kimlik>/
# Alanlar: ad, ozet (tek cümle), sorun, rol, araclar, karar, sonuc,
