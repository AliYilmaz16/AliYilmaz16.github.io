  - kimlik: sec-ded
    yil: 2025
    ad: { tr: Hamming SEC-DED Simülatörü, en: Hamming SEC-DED Simulator }
    alan: masaustu
    baglam:
      tr: Bilgisayar Mimarisi dersi dönem projesi
      en: Term project, Computer Architecture
    ozet:
      tr: Hamming kodunda tek hata düzeltmeyi ve çift hata tespitini bit bit gösteren PyQt5 simülatörü.
      en: A PyQt5 simulator that shows single-error correction and double-error detection in Hamming codes, bit by bit.
    sorun:
      tr: Hamming kodunun hatayı nasıl bulup düzelttiği kâğıt üzerinde izlenmesi zor bir konu. Amaç, kodlamayı, hata eklemeyi ve düzeltmeyi görünür kılmaktı.
      en: How a Hamming code locates and corrects an error is hard to follow on paper. The aim was to make encoding, error injection and correction visible.
    rol: { tr: "", en: "" }
    araclar: [Python, PyQt5]
    karar: { tr: "", en: "" }
    sonuc:
      tr: 8, 16 ve 32 bitlik veri kodlanıyor; veri, eşlik ve hatalı bitler ayrı renklerle gösteriliyor. Seçilen bite hata eklenebiliyor, sendrom hesaplanıyor, tek hata düzeltiliyor, çift hata bildiriliyor. Kodlar belleğe yazılıp geri okunabiliyor.
      en: 8-, 16- and 32-bit data can be encoded; data, parity and faulty bits are shown in different colours. An error can be injected at a chosen bit, the syndrome is computed, single errors are corrected and double errors are reported. Codes can be written to memory and read back.
    gorseller:
      - dosya: ana_ekran.png
        alt: { tr: Simülatör ana ekranı, en: Simulator main screen }
      - dosya: tek_hata.png
        alt: { tr: Tek bit hatası, en: Single-bit error }
      - dosya: cift_hata.png
        alt: { tr: Çift bit hatası, en: Double-bit error }
      - dosya: bellege_kaydet.png
        alt: { tr: Belleğe kaydetme, en: Saving to memory }
    video_baglanti: https://www.youtube.com/watch?v=j0MOhqZ0uog
    etkilesim: hamming
    depo: https://github.com/AliYilmaz16/SEC-DED-Kodlay-c-

